---
- name: Install Nginx
  dnf:
    name: "{{ nginx_package }}"
    state: present

- name: Start Nginx
  service:
    name: nginx
    state: started
    enabled: true

- name: Copy Nginx configuration
  copy:
    content: |
      server {
          listen 8080;
          server_name localhost;

          location / {
              return 200 "Hello from Ansible Role!";
          }
      }
    dest: /etc/nginx/conf.d/role-demo.conf
  notify: Restart Nginx